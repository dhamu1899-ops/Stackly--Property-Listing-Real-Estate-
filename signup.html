<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | STACKLY - Join Curated Real Estate Collection</title>
  <!-- Google Fonts: Playfair Display for serif headings, Plus Jakarta Sans for clean typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page-body">

  <div class="auth-split-wrapper">
    <!-- LEFT FORM COLUMN -->
    <div class="auth-form-col">
      <div class="auth-form-container">
        <!-- Back Link -->
        <a href="index.html" class="auth-back-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#067A52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Back
        </a>

        <!-- Logo -->
        <a href="index.html" class="auth-logo-link">
          <img src="Home.img/logo_stackly_dark.webp" alt="STACKLY Logo" class="auth-logo">
        </a>

        <p class="auth-subtitle">Sign Up to access your curated collection.</p>

        <!-- Form Card -->
        <div class="auth-card">
          <form class="auth-form" id="signupForm" novalidate>
            <!-- ROLE BASED FIELD -->
            <div class="role-selector-group">
              <label class="form-label-uppercase">Register As</label>
              <div class="role-tabs-container">
                <button type="button" class="role-tab-btn active" data-role="client">Client</button>
                <button type="button" class="role-tab-btn" data-role="admin">Admin</button>
                <input type="hidden" name="user_role" id="signup_user_role" value="client">
              </div>
            </div>

            <div class="form-group">
              <label class="form-label-uppercase">Full Name</label>
              <input type="text" class="auth-input" placeholder="Enter your Full Name" required>
            </div>

            <div class="form-group">
              <label class="form-label-uppercase">Email Address</label>
              <input type="email" class="auth-input" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
              <label class="form-label-uppercase">Password</label>
              <div class="password-input-wrapper">
                <input type="password" class="auth-input" placeholder="Enter your password" required>
                <button type="button" class="eye-toggle-btn" aria-label="Toggle password visibility">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label-uppercase">Confirm Password</label>
              <div class="password-input-wrapper">
                <input type="password" class="auth-input" placeholder="Enter your password" required>
                <button type="button" class="eye-toggle-btn" aria-label="Toggle password visibility">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </div>

            <div class="auth-options-row">
              <label class="remember-me-label">
                <input type="checkbox" class="checkbox-input" required>
                <span>I agree to the Terms &amp; Privacy Policy</span>
              </label>
            </div>

            <button type="submit" class="btn-auth-submit">Sign Up</button>

            <!-- Social Divider -->
            <div class="social-divider">
              <span>Or continue with</span>
            </div>

            <!-- Social Login Buttons -->
            <div class="social-buttons-row">
              <a href="https://accounts.google.com/" target="_blank" rel="noopener noreferrer" class="btn-social-outline">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/></svg>
                Google
              </a>
              <a href="https://appleid.apple.com/" target="_blank" rel="noopener noreferrer" class="btn-social-outline">
                <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.63c.66-.8 1.12-1.92.99-3.03-.97.04-2.15.65-2.84 1.45-.61.71-1.15 1.85-.99 2.95 1.08.08 2.18-.56 2.84-1.37z"/></svg>
                Apple
              </a>
            </div>
          </form>
        </div>

        <p class="auth-bottom-switch text-center">
          Already have an account? <a href="login.html" class="switch-link">Login</a>
        </p>
      </div>
    </div>

    <!-- RIGHT HERO COLUMN -->
    <div class="auth-hero-col">
      <img src="Testimonals.img/section1_testimonials_hero_skyscrapers_fog.webp" alt="Luxury Architecture" class="auth-hero-img">
      <div class="auth-hero-overlay">
        <h2 class="auth-hero-title">Curated Excellence</h2>
        <p class="auth-hero-desc">Discover unparalleled properties tailored to the most discerning tastes.</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>

  <!-- SIGNUP HANDLER: Self-contained, works on file:// AND Live Server -->
  <script>
    (function() {
      var form = document.getElementById('signupForm');
      if (!form) return;

      // Role tab switcher
      var roleTabs = form.querySelectorAll('.role-tab-btn');
      var hiddenRole = document.getElementById('signup_user_role');
      roleTabs.forEach(function(btn) {
        btn.addEventListener('click', function() {
          roleTabs.forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');
          if (hiddenRole) hiddenRole.value = btn.getAttribute('data-role');
        });
      });

      // Eye toggles
      form.querySelectorAll('.eye-toggle-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var inp = btn.closest('.password-input-wrapper').querySelector('input');
          inp.type = inp.type === 'password' ? 'text' : 'password';
        });
      });

      // Clear red borders on input
      form.querySelectorAll('input').forEach(function(inp) {
        inp.addEventListener('input', function() {
          inp.style.borderColor = '';
          inp.style.backgroundColor = '';
        });
      });

      // Helper: mark field as error
      function markError(el) {
        if (!el) return;
        el.style.borderColor = '#EF4444';
        el.style.backgroundColor = '#FEF2F2';
      }

      // SUBMIT HANDLER
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        e.stopImmediatePropagation();

        var nameEl     = form.querySelector('input[type="text"]');
        var emailEl    = form.querySelector('input[type="email"]');
        var passwords  = form.querySelectorAll('input[type="password"]');
        var termsEl    = form.querySelector('input[type="checkbox"]');

        var fullName = nameEl     ? nameEl.value.trim()           : '';
        var email    = emailEl   ? emailEl.value.trim()           : '';
        var pass1    = passwords[0] ? passwords[0].value.trim()  : '';
        var pass2    = passwords[1] ? passwords[1].value.trim()  : '';
        var agreed   = termsEl   ? termsEl.checked               : false;

        var ok = true;

        // Reset all
        [nameEl, emailEl, passwords[0], passwords[1]].forEach(function(el) {
          if (el) { el.style.borderColor = ''; el.style.backgroundColor = ''; }
        });

        if (!fullName)  { markError(nameEl);       ok = false; }
        if (!email)     { markError(emailEl);      ok = false; }
        if (!pass1)     { markError(passwords[0]); ok = false; }
        if (!pass2)     { markError(passwords[1]); ok = false; }

        if (!ok) {
          if (typeof showToast === 'function') showToast('Please fill in all required fields.', 'error');
          return;
        }

        if (pass1 !== pass2) {
          markError(passwords[1]);
          if (typeof showToast === 'function') showToast('Passwords do not match!', 'error');
          return;
        }

        if (!agreed) {
          if (typeof showToast === 'function') showToast('Please agree to the Terms & Privacy Policy.', 'error');
          return;
        }

        // Show success banner
        var banner = document.createElement('div');
        banner.style.cssText = 'background:#D1FAE5;border:1.5px solid #059669;color:#065F46;padding:14px 18px;border-radius:10px;font-size:14px;font-weight:600;margin-bottom:16px;';
        banner.textContent = '\u2713 Account created! Welcome, ' + fullName + '. Redirecting to Login...';
        form.insertBefore(banner, form.firstChild);

        if (typeof showToast === 'function') showToast('Account registered successfully!', 'success');

        // Navigate to login after 800ms
        setTimeout(function() {
          window.location.href = 'login.html';
        }, 800);
      });
    })();
  </script>

</body>
</html>
