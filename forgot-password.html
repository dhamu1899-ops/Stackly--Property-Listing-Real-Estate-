<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | STACKLY - Reset Your Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page-body">

  <div class="auth-split-wrapper">
    <!-- LEFT FORM COLUMN -->
    <div class="auth-form-col">
      <div class="auth-form-container">

        <!-- Back Link -->
        <a href="login.html" class="auth-back-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#067A52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Back to Login
        </a>

        <!-- Logo -->
        <a href="index.html" class="auth-logo-link">
          <img src="Home.img/logo_stackly_dark.webp" alt="STACKLY Logo" class="auth-logo">
        </a>

        <h1 class="auth-title" style="font-family:var(--font-serif);font-size:32px;font-weight:700;color:#101828;margin-bottom:8px;">Reset Password</h1>
        <p class="auth-subtitle">Enter your registered email address and we'll send you a reset link.</p>

        <!-- Form Card -->
        <div class="auth-card">

          <!-- SUCCESS MESSAGE (hidden initially) -->
          <div id="fp-success-banner" style="display:none; background:#D1FAE5; border:1.5px solid #059669; color:#065F46; padding:18px 20px; border-radius:10px; font-size:15px; font-weight:600; margin-bottom:20px; line-height:1.6;">
            <div style="font-size:22px; margin-bottom:6px;">✅</div>
            <div id="fp-success-text">Password reset link sent!</div>
            <div style="font-size:13px; font-weight:400; margin-top:6px; color:#047857;">Redirecting you to Login page...</div>
          </div>

          <form id="forgotPasswordForm" novalidate>
            <div class="form-group">
              <label class="form-label-uppercase">Email Address</label>
              <input type="email" id="fp-email" class="auth-input" placeholder="Enter your registered email" autocomplete="email">
              <span id="fp-error" style="display:none; color:#EF4444; font-size:12px; font-weight:600; margin-top:6px; display:block;"></span>
            </div>

            <button type="submit" class="btn-auth-submit" id="fp-submit-btn">Send Reset Link</button>
          </form>
        </div>

        <p class="auth-bottom-switch text-center">
          Remembered your password? <a href="login.html" class="switch-link">Login</a>
        </p>
      </div>
    </div>

    <!-- RIGHT HERO COLUMN -->
    <div class="auth-hero-col">
      <img src="Testimonals.img/section1_testimonials_hero_skyscrapers_fog.webp" alt="Luxury Architecture" class="auth-hero-img">
      <div class="auth-hero-overlay">
        <h2 class="auth-hero-title">Curated Excellence</h2>
        <p class="auth-hero-desc">Discover unparalleled properties tailored to the most discerning tastes.</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>

  <!-- INLINE HANDLER — Guaranteed to work regardless of script.js load order -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var form       = document.getElementById('forgotPasswordForm');
      var emailInput = document.getElementById('fp-email');
      var errorSpan  = document.getElementById('fp-error');
      var successBanner = document.getElementById('fp-success-banner');
      var successText   = document.getElementById('fp-success-text');
      var submitBtn  = document.getElementById('fp-submit-btn');

      if (!form) return;

      // Clear error on typing
      emailInput.addEventListener('input', function() {
        emailInput.style.borderColor      = '';
        emailInput.style.backgroundColor  = '';
        errorSpan.style.display           = 'none';
        errorSpan.textContent             = '';
      });

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        e.stopImmediatePropagation();

        var email = emailInput.value.trim();

        // Validate
        if (!email) {
          emailInput.style.borderColor     = '#EF4444';
          emailInput.style.backgroundColor = '#FEF2F2';
          errorSpan.textContent            = '⚠ Please enter your email address.';
          errorSpan.style.display          = 'block';
          return;
        }

        if (!email.includes('@') || !email.includes('.')) {
          emailInput.style.borderColor     = '#EF4444';
          emailInput.style.backgroundColor = '#FEF2F2';
          errorSpan.textContent            = '⚠ Please enter a valid email address.';
          errorSpan.style.display          = 'block';
          return;
        }

        // Hide form fields, show success
        form.style.display        = 'none';
        successBanner.style.display = 'block';
        successText.innerHTML = 'Reset link sent to <strong>' + email + '</strong>';

        // Show toast if available
        if (typeof showToast === 'function') {
          showToast('Password reset link sent! Check your email.', 'success');
        }

        // Navigate to login after 2 seconds
        setTimeout(function() {
          window.location.href = 'login.html';
        }, 2000);
      });
    });
  </script>

</body>
</html>
