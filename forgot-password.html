<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | STACKLY - Curated Luxury Real Estate</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page-body">

  <div class="auth-split-wrapper">
    <!-- LEFT FORM COLUMN -->
    <div class="auth-form-col">
      <div class="auth-form-container">
        <!-- Back Link -->
        <a href="login.html" class="auth-back-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#067A52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Back to Login
        </a>

        <!-- Logo -->
        <a href="index.html" class="auth-logo-link">
          <img src="Home.img/logo_stackly_dark.webp" alt="STACKLY Logo" class="auth-logo">
        </a>

        <h1 class="auth-title" style="font-family: var(--font-serif); font-size: 32px; font-weight: 700; color: #101828; margin-bottom: 8px;">Reset Password</h1>
        <p class="auth-subtitle">Enter your registered email address and we'll send you instructions to reset your password.</p>

        <!-- Form Card -->
        <div class="auth-card">
          <form class="auth-form" id="forgotPasswordForm">
            <div class="form-group">
              <label class="form-label-uppercase">Email Address *</label>
              <input type="email" class="auth-input" placeholder="Enter your email address" required>
            </div>

            <button type="submit" class="btn-auth-submit">Send Reset Link</button>
          </form>
        </div>

        <p class="auth-bottom-switch text-center">
          Remembered your password? <a href="login.html" class="switch-link">Login</a>
        </p>
      </div>
    </div>

    <!-- RIGHT HERO COLUMN -->
    <div class="auth-hero-col">
      <img src="Testimonals.img/section1_testimonials_hero_skyscrapers_fog.webp" alt="Luxury Architecture" class="auth-hero-img">
      <div class="auth-hero-overlay">
        <h2 class="auth-hero-title">Curated Excellence</h2>
        <p class="auth-hero-desc">Discover unparalleled properties tailored to the most discerning tastes.</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
