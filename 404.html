<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Lost in Luxury | STACKLY</title>
  <!-- Google Fonts: Playfair Display for serif headings, Plus Jakarta Sans for clean typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="error-404-body">

  <main class="error-404-wrapper">
    <div class="error-404-container text-center">
      <span class="error-code">404</span>
      <h1 class="error-title">Lost in Luxury</h1>
      <p class="error-description">
        It seems the property you are looking for has been moved or doesn't exist. Let us guide you back home.
      </p>

      <!-- Search Bar -->
      <div class="error-search-box">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" class="error-search-input" placeholder="Search properties by location or ID...">
        <button type="button" class="btn-error-search">Search</button>
      </div>

      <!-- Action Buttons -->
      <div class="error-actions-row">
        <a href="index.html" class="btn-back-home">Back to Home</a>
        <a href="contact.html" class="btn-contact-agent">Contact an Agent</a>
      </div>

      <div class="error-divider"></div>

      <!-- Helpful Links -->
      <div class="helpful-links-container">
        <span class="helpful-links-tag">HELPFUL LINKS</span>
        <div class="helpful-links-row">
          <a href="properties.html" class="helpful-link-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Browse Properties</span>
          </a>
          <a href="services.html" class="helpful-link-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
            <span>Our Services</span>
          </a>
          <a href="contact.html" class="helpful-link-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <span>Contact Support</span>
          </a>
        </div>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
